<svg width="300" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="400" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Phone Screen Mockup -->
  <rect x="20" y="20" width="260" height="360" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="8"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="260" height="50" fill="#16a34a" rx="8"/>
  <text x="150" y="50" font-family="Arial" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Payment App</text>
  
  <!-- Transaction Section -->
  <rect x="30" y="90" width="240" height="120" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" rx="4"/>
  
  <!-- Transaction ID Label -->
  <text x="45" y="115" font-family="Arial" font-size="12" fill="#166534" font-weight="bold">Transaction ID</text>
  
  <!-- Transaction ID Value Highlighted -->
  <rect x="45" y="125" width="210" height="30" fill="#dcfce7" stroke="#22c55e" stroke-width="2" rx="4"/>
  <text x="150" y="145" font-family="Arial" font-size="13" fill="#166534" text-anchor="middle" font-weight="bold">T2505032120266449300366</text>
  
  <!-- Arrow pointing to Transaction ID -->
  <path d="M280 140 L260 140" stroke="#dc2626" stroke-width="3" fill="none"/>
  <text x="285" y="145" font-family="Arial" font-size="16" fill="#dc2626" font-weight="bold">←</text>
  
  <!-- UTR Section -->
  <text x="45" y="175" font-family="Arial" font-size="11" fill="#6b7280">UTR: 480402796155</text>
  
  <!-- Status -->
  <rect x="30" y="240" width="240" height="40" fill="#dcfce7" stroke="#22c55e" stroke-width="1" rx="4"/>
  <text x="150" y="265" font-family="Arial" font-size="12" fill="#166534" text-anchor="middle" font-weight="bold">Transaction Successful</text>
  
  <!-- Footer -->
  <text x="150" y="320" font-family="Arial" font-size="10" fill="#9ca3af" text-anchor="middle">Powered by UPI YES BANK</text>
  
  <!-- Caption -->
  <text x="150" y="385" font-family="Arial" font-size="11" fill="#374151" text-anchor="middle" font-weight="bold">Example 1: PhonePe Transaction Details</text>
</svg>