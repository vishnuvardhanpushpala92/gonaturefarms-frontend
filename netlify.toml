[build]
  command = "npm run build"
  publish = "dist"

# Proxy API and upload requests server-side to the Railway backend so the
# browser only ever talks to the Netlify origin. This avoids relying on the
# backend sending Access-Control-Allow-Origin, since Netlify-to-Railway is a
# server-to-server request and is never subject to browser CORS checks.
[[redirects]]
  from = "/api/*"
  to = "https://gonaturefarms-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://gonaturefarms-backend-production.up.railway.app/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
